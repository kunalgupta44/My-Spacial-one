<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💌 Love Message</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <div class="message-box">
            <h1 class="title">💌 Special Love Message 💌</h1>
            
            <div class="typewriter-container">
                <div class="typewriter" id="typewriter">
                    <span class="cursor" id="cursor"></span>
                </div>
            </div>

            <div class="navigation">
                <a href="index.html" class="nav-btn">🏠 Home</a>
                <a href="index1.html" class="nav-btn">📸 Love Gallery</a>
                <a href="index3.html" class="nav-btn">🎁 Surprise</a>
            </div>
        </div>
    </div>

    <script>
        // Typewriter effect
        const message = `❤️ To Someone Very Special!
You are not just a part of my life, you are one of the most beautiful feelings in my heart.
Every moment with you feels special, every smile of yours makes my day better, and every memory with you stays close to my heart.
I just want you to know that you are truly special to me, and I will always care for you deeply.
You are my favorite person, my sweetest memory, and my most beautiful reason to smile. ❤️💕`;

        let i = 0;
        const typewriter = document.getElementById('typewriter');
        const cursor = document.getElementById('cursor');
        
        function typeWriter() {
            if (i < message.length) {
                if (message.charAt(i) === '\n') {
                    typewriter.innerHTML += '<br>';
                } else {
                    typewriter.innerHTML += message.charAt(i);
                }
                i++;
                setTimeout(typeWriter, 50);
            } else {
                cursor.style.display = 'none';
            }
        }

        // Start typewriter effect after a short delay
        setTimeout(typeWriter, 1000);

        // Create falling hearts
        function createFallingHeart() {
            const heart = document.createElement('div');
            heart.className = 'falling-hearts';
            heart.innerHTML = ['❤️', '💕', '💖', '💝', '🌹'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            heart.style.fontSize = (Math.random() * 1 + 1.5) + 'rem';
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        // Create falling hearts continuously
        setInterval(createFallingHeart, 500);

        // Create decorative hearts around the message box
        function createHeartDecoration() {
            const decoration = document.createElement('div');
            decoration.className = 'heart-decoration';
            decoration.innerHTML = '💕';
            decoration.style.left = Math.random() * 100 + '%';
            decoration.style.top = Math.random() * 100 + '%';
            decoration.style.animationDelay = Math.random() * 2 + 's';
            
            document.body.appendChild(decoration);
            
            setTimeout(() => {
                decoration.remove();
            }, 4000);
        }

        // Create heart decorations
        setInterval(createHeartDecoration, 2000);

        // Initial burst of hearts
        for (let i = 0; i < 5; i++) {
            setTimeout(createFallingHeart, i * 200);
        }
    </script>
</body>
</html>
